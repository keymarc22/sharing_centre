# PostgreSQL. Versions 9.3 and up are supported.
#
#   Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
# Connection is driven by DATABASE_URL in every environment. dev/test fall back
# to a local default so they work without setting anything; CI and Heroku
# provide their own DATABASE_URL.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgres://keymar@localhost:5432/sharing_centre_dev" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgres://admin@localhost:5432/sharing_centre_test" } %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
